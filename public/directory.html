<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directory — Girandole</title>
  <meta name="description" content="Browse APIs, MCP servers, skills, agents, and more in the Girandole directory.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='20' stroke='%2394a3b8' stroke-width='2' fill='none'/><circle cx='32' cy='32' r='6' fill='%23dc2626'/></svg>">
  <style>
    :root {
      --bg: #0a0a0f;
      --bg-card: #12121a;
      --bg-card-hover: #1a1a24;
      --text: #e8e6e3;
      --text-dim: #94a3b8;
      --accent: #dc2626;
      --accent-glow: #ef4444;
      --border: #2a2a35;
      --success: #22c55e;
      --gold: #f59e0b;
      --blue: #3b82f6;
      --sponsored-bg: #1a1510;
      --sponsored-border: #b45309;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    
    /* Nav */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .logo span { color: var(--accent); }
    .nav-links { display: flex; gap: 2rem; }
    .nav-links a {
      color: var(--text-dim);
      text-decoration: none;
      font-weight: 500;
    }
    .nav-links a:hover { color: var(--text); }
    
    /* Main */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem;
    }
    
    /* Search & Filters */
    .search-section {
      margin-bottom: 2rem;
    }
    .search-box {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .search-box input {
      flex: 1;
      padding: 0.9rem 1.25rem;
      font-size: 1rem;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--bg-card);
      color: var(--text);
      outline: none;
    }
    .search-box input:focus { border-color: var(--accent); }
    .search-box input::placeholder { color: var(--text-dim); }
    .search-box button {
      padding: 0.9rem 1.5rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    .search-box button:hover { background: var(--accent-glow); }
    
    .filters {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 0.5rem 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-dim);
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    
    /* Results */
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      color: var(--text-dim);
      font-size: 0.95rem;
    }
    
    .listings {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    
    /* Listing Card */
    .listing-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      transition: all 0.2s;
      cursor: pointer;
    }
    .listing-card:hover {
      border-color: var(--accent);
      transform: translateX(4px);
    }
    .listing-card.sponsored {
      background: var(--sponsored-bg);
      border-color: var(--sponsored-border);
    }
    .listing-card.sample {
      opacity: 0.75;
    }
    .badge.sample {
      background: #374151;
      color: #9ca3af;
      border-color: #4b5563;
    }
    .listing-card.sponsored::before {
      content: 'Sponsored';
      position: absolute;
      top: -8px;
      left: 12px;
      background: var(--gold);
      color: #000;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .listing-card.sponsored {
      position: relative;
      margin-top: 8px;
    }
    
    .listing-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.5rem;
    }
    .listing-title {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .listing-icon {
      font-size: 1.4rem;
    }
    .listing-name {
      font-size: 1.1rem;
      font-weight: 600;
    }
    .listing-type {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    
    .listing-desc {
      color: var(--text-dim);
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
    }
    
    .listing-meta {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .listing-badges {
      display: flex;
      gap: 0.4rem;
    }
    .badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    .listing-rating {
      color: var(--gold);
      font-size: 0.9rem;
    }
    .listing-reviews {
      color: var(--text-dim);
      font-size: 0.85rem;
    }
    .listing-pricing {
      font-size: 0.8rem;
      padding: 0.2rem 0.5rem;
      background: var(--success);
      color: #fff;
      border-radius: 4px;
      text-transform: capitalize;
    }
    .listing-pricing.usage { background: var(--blue); }
    .listing-pricing.freemium { background: #6366f1; }
    .listing-pricing.monthly, .listing-pricing.per_task { background: var(--gold); color: #000; }
    
    .copy-endpoint-btn {
      padding: 0.3rem 0.6rem;
      background: var(--bg);
      border: 1px solid var(--gold);
      border-radius: 4px;
      color: var(--gold);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .copy-endpoint-btn:hover {
      background: var(--gold);
      color: #000;
    }
    
    /* Loading */
    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--text-dim);
    }
    .loading-spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* Empty state */
    .empty {
      text-align: center;
      padding: 3rem;
      color: var(--text-dim);
    }
    
    /* Footer */
    footer {
      padding: 2rem;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.9rem;
      border-top: 1px solid var(--border);
      margin-top: 3rem;
    }
    footer a { color: var(--accent); text-decoration: none; }
    
    @media (max-width: 600px) {
      .listing-header { flex-direction: column; gap: 0.5rem; }
      .filters { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 0.5rem; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="logo">🕯️ <span>Girandole</span></a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/demo-ads.html">How Ads Work</a>
      <a href="/api/registry.json">API</a>
    </div>
  </nav>

  <div class="container">
    
    <section class="search-section">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search APIs, MCP servers, skills, agents...">
        <button onclick="doSearch()">Search</button>
      </div>
      <div class="filters">
        <button class="filter-btn active" data-type="">All</button>
        <button class="filter-btn" data-type="api">🔌 APIs</button>
        <button class="filter-btn" data-type="mcp">🔗 MCP</button>
        <button class="filter-btn" data-type="skill">📦 Skills</button>
        <button class="filter-btn" data-type="agent">🤖 Agents</button>
        <button class="filter-btn" data-type="data">📊 Data</button>
        <button class="filter-btn" data-type="tool">🔧 Tools</button>
      </div>
    </section>
    
    <div class="results-header">
      <span id="results-count">Loading...</span>
    </div>
    
    <div id="listings" class="listings">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p>Loading listings...</p>
      </div>
    </div>
    
  </div>

  <footer>
    <p>© 2026 Girandole · <a href="/">The Agent Economy Platform</a></p>
  </footer>

  <script>
    const typeIcons = {
      api: '🔌',
      mcp: '🔗',
      skill: '📦',
      agent: '🤖',
      data: '📊',
      tool: '🔧'
    };
    
    let currentType = '';
    let currentQuery = '';
    
    // Load initial listings
    document.addEventListener('DOMContentLoaded', () => {
      // Check URL params
      const params = new URLSearchParams(window.location.search);
      currentType = params.get('type') || '';
      currentQuery = params.get('q') || '';
      
      if (currentQuery) {
        document.getElementById('search-input').value = currentQuery;
      }
      if (currentType) {
        document.querySelectorAll('.filter-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.type === currentType);
        });
      }
      
      fetchListings();
      
      // Filter buttons
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentType = btn.dataset.type;
          fetchListings();
        });
      });
      
      // Search on enter
      document.getElementById('search-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') doSearch();
      });
    });
    
    function doSearch() {
      currentQuery = document.getElementById('search-input').value.trim();
      fetchListings();
    }
    
    async function fetchListings() {
      const container = document.getElementById('listings');
      container.innerHTML = '<div class="loading"><div class="loading-spinner"></div><p>Loading listings...</p></div>';
      
      try {
        // Fetch both organic listings and sponsored results
        let url = '/api/listings?limit=50';
        if (currentType) url += `&type=${currentType}`;
        if (currentQuery) url += `&q=${encodeURIComponent(currentQuery)}`;
        
        const [listingsRes, sponsoredRes] = await Promise.all([
          fetch(url),
          currentQuery ? fetch(`/api/ads/search?q=${encodeURIComponent(currentQuery)}&limit=2`) : Promise.resolve({ json: () => ({ ads: [] }) })
        ]);
        
        const data = await listingsRes.json();
        const sponsoredData = await sponsoredRes.json();
        
        document.getElementById('results-count').textContent = 
          `${data.total} listing${data.total !== 1 ? 's' : ''} found`;
        
        let html = '';
        
        // Show sponsored results first (if any)
        if (sponsoredData.ads && sponsoredData.ads.length > 0) {
          html += sponsoredData.ads.map(ad => renderSponsored(ad)).join('');
        }
        
        // Then show organic results
        if (data.listings.length === 0 && sponsoredData.ads.length === 0) {
          container.innerHTML = '<div class="empty">No listings found. Try a different search.</div>';
          return;
        }
        
        html += data.listings.map(listing => renderListing(listing)).join('');
        container.innerHTML = html;
        
      } catch (err) {
        console.error('Error fetching listings:', err);
        container.innerHTML = '<div class="empty">Error loading listings. Please try again.</div>';
      }
    }
    
    function renderSponsored(ad) {
      return `
        <div class="listing-card sponsored" onclick="trackAdClick('${ad.campaign_id}', '${ad.listing_slug}')">
          <div class="listing-header">
            <div class="listing-title">
              <span class="listing-icon">📢</span>
              <span class="listing-name">${escapeHtml(ad.name)}</span>
            </div>
            <span class="listing-type">SPONSORED</span>
          </div>
          <p class="listing-desc">${escapeHtml(ad.description || '')}</p>
          <div class="listing-meta">
            <div class="listing-badges">
              ${(ad.badges || []).map(b => `<span class="badge">${badgeIcon(b)} ${b}</span>`).join('')}
            </div>
            ${ad.avg_rating ? `<span class="listing-rating">★ ${parseFloat(ad.avg_rating).toFixed(1)}</span>` : ''}
            <button class="copy-endpoint-btn" onclick="event.stopPropagation(); copyEndpoint('${ad.destination_url || '/listing/' + ad.listing_slug}', '${ad.campaign_id}')">📋 Copy Endpoint</button>
          </div>
        </div>
      `;
    }
    
    function trackAdClick(campaignId, slug) {
      // Track the click
      fetch('/api/ads/click', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ campaign_id: campaignId })
      }).catch(() => {});
      
      // Show listing detail (for now just alert)
      viewListing(slug);
    }
    
    function copyEndpoint(url, campaignId) {
      navigator.clipboard.writeText(url);
      
      // Track as click
      if (campaignId) {
        fetch('/api/ads/click', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ campaign_id: campaignId })
        }).catch(() => {});
      }
      
      // Show feedback
      const btn = event.target;
      btn.textContent = '✓ Copied!';
      setTimeout(() => { btn.textContent = '📋 Copy Endpoint'; }, 2000);
    }
    
    function renderListing(l) {
      const icon = typeIcons[l.type] || '📄';
      const badges = (l.badges || []).map(b => `<span class="badge">${badgeIcon(b)} ${b}</span>`).join('');
      const rating = l.avg_rating ? `<span class="listing-rating">★ ${parseFloat(l.avg_rating).toFixed(1)}</span>` : '';
      const reviews = l.review_count ? `<span class="listing-reviews">(${l.review_count} reviews)</span>` : '';
      const pricing = l.pricing_model ? `<span class="listing-pricing ${l.pricing_model}">${l.pricing_model}</span>` : '';
      const sampleBadge = l.is_sample ? '<span class="badge sample">📋 SAMPLE</span>' : '';
      
      return `
        <div class="listing-card${l.is_sample ? ' sample' : ''}" onclick="viewListing('${l.slug}')">
          <div class="listing-header">
            <div class="listing-title">
              <span class="listing-icon">${icon}</span>
              <span class="listing-name">${escapeHtml(l.name)}</span>
            </div>
            <span class="listing-type">${l.type}</span>
          </div>
          <p class="listing-desc">${escapeHtml(l.short_description || l.description || '').slice(0, 150)}</p>
          <div class="listing-meta">
            <div class="listing-badges">${sampleBadge}${badges}</div>
            ${rating} ${reviews} ${pricing}
          </div>
        </div>
      `;
    }
    
    function badgeIcon(badge) {
      const icons = {
        verified: '✓',
        fast: '⚡',
        reliable: '🟢',
        established: '🏛️',
        'top-rated': '⭐'
      };
      return icons[badge] || '';
    }
    
    function viewListing(slug) {
      window.location.href = `/listing.html?slug=${slug}`;
    }
    
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>

</body>
</html>
