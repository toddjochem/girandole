[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# API routes
[[redirects]]
  from = "/api/registry.json"
  to = "/.netlify/functions/registry"
  status = 200

[[redirects]]
  from = "/api/submit"
  to = "/.netlify/functions/submit"
  status = 200

[[redirects]]
  from = "/api/notifications"
  to = "/.netlify/functions/notifications"
  status = 200
